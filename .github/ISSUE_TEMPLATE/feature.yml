name: Feature request
description: Suggest an improvement, a missing affordance, or a new capability.
title: "[Feature] "
labels:
  - feedback
  - enhancement
  - alpha
body:
  - type: markdown
    attributes:
      value: |
        LightYou is alpha — the roadmap is flexible. Concrete, grounded suggestions from real reading sessions help more than abstract wishlists.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the friction or gap, not the solution yet.
      placeholder: I subscribe to 40 sources, and the Today view is overwhelming when I come back after a weekend.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: If you have a specific shape in mind, sketch it. Don't feel obligated — the problem description above is the most valuable part.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other reader apps, workflows, or manual workarounds you currently use.

  - type: markdown
    attributes:
      value: |
        ---
        Not every request lands in the next release — but every thoughtful one shapes the direction. Thanks.
